# Compilation et tests à chaque push et pull request : Linux (Qt 5 et Qt 6, avec un passage aux sanitizers), macOS, Windows
# Caches : ccache sous Linux (seuls les fichiers modifiés sont recompilés), Qt et OpenSSL déjà compilé sous Windows.
# macOS sans ccache : qmake y appelle les compilateurs de Xcode par leur chemin complet.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency: # un nouveau push annule la vérification en cours de la même branche
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_QPA_PLATFORM: offscreen # tests d'interface sans écran
  QT_FORCE_STDERR_LOGGING: 1 # sous Windows sans console, qWarning/qFatal iraient dans OutputDebugString, invisible ici

jobs:
  linux:
    name: Linux (Qt 5, gcc)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dépendances
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qtbase5-dev qtbase5-dev-tools qt5-qmake qttools5-dev-tools libssl-dev
          echo /usr/lib/qt5/bin >> "$GITHUB_PATH"
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: linux
          create-symlink: true # gcc et g++ passent par ccache
      - name: Application
        run: |
          mkdir build && cd build
          qmake ../p2pchat.pro
          make -j"$(nproc)"
      - name: Tests
        run: |
          mkdir build-tests && cd build-tests
          qmake ../tests/tests.pro
          make -j"$(nproc)"
          make check

  # Qt 6 : ce qui est déprécié y est une erreur (sinon rien ne le signale tant que le reste de la CI est en Qt 5)
  linux-qt6:
    name: Linux (Qt 6, gcc)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dépendances
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qt6-base-dev qt6-base-dev-tools qmake6 qt6-l10n-tools libssl-dev
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: linux-qt6
          create-symlink: true
      - name: Application
        run: |
          mkdir build && cd build
          qmake6 ../p2pchat.pro "QMAKE_CXXFLAGS+=-Werror=deprecated-declarations"
          make -j"$(nproc)"
      - name: Tests
        run: |
          mkdir build-tests && cd build-tests
          qmake6 ../tests/tests.pro "QMAKE_CXXFLAGS+=-Werror=deprecated-declarations"
          make -j"$(nproc)"
          make check

  sanitizers:
    name: Linux, AddressSanitizer + UBSan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dépendances
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qtbase5-dev qtbase5-dev-tools qt5-qmake qttools5-dev-tools libssl-dev
          echo /usr/lib/qt5/bin >> "$GITHUB_PATH"
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: sanitizers # options de compilation différentes : cache à part
          create-symlink: true
      - name: Tests sous sanitizers
        run: tests/run-sanitizers.sh "$PWD/build-asan"

  macos:
    name: macOS (Qt 5, clang)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dépendances
        run: |
          brew install qt@5 openssl@3
          echo "$(brew --prefix qt@5)/bin" >> "$GITHUB_PATH"
      - name: Application
        run: |
          mkdir build && cd build
          qmake ../p2pchat.pro
          make -j"$(sysctl -n hw.ncpu)"
      - name: Tests
        run: |
          mkdir build-tests && cd build-tests
          qmake ../tests/tests.pro
          make -j"$(sysctl -n hw.ncpu)"
          make check

  windows:
    name: Windows (Qt 5, MSVC)
    runs-on: windows-2022 # Visual Studio 2022 : Qt 5.15.2 ne suit pas les compilateurs plus récents
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          arch: win64_msvc2019_64
          cache: true
      # OpenSSL compilé une fois par vcpkg, puis repris du cache (sinon : plusieurs minutes à chaque fois)
      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\vcpkg-cache
          key: vcpkg-openssl-${{ runner.os }}-${{ github.run_id }}
          restore-keys: vcpkg-openssl-${{ runner.os }}-
      - name: OpenSSL (vcpkg)
        shell: pwsh
        env:
          VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}\vcpkg-cache,readwrite
        run: |
          New-Item -ItemType Directory -Force -Path "${{ github.workspace }}\vcpkg-cache" | Out-Null
          vcpkg install openssl:x64-windows
          $dir = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows"
          "OPENSSL_DIR=$dir" >> $env:GITHUB_ENV
          "$dir\bin" >> $env:GITHUB_PATH
      - name: Application
        shell: cmd
        run: |
          mkdir build && cd build
          qmake ..\p2pchat.pro
          nmake
      - name: Tests
        shell: cmd
        run: |
          mkdir build-tests && cd build-tests
          qmake ..\tests\tests.pro
          nmake
          nmake check
