# Compilation et tests à chaque push et pull request : Linux (avec un passage aux sanitizers), macOS, Windows
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency: # un nouveau push annule la vérification en cours de la même branche
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_QPA_PLATFORM: offscreen # tests d'interface sans écran

jobs:
  linux:
    name: Linux (Qt 5, gcc)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dépendances
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qtbase5-dev qtbase5-dev-tools qt5-qmake libssl-dev
          echo /usr/lib/qt5/bin >> "$GITHUB_PATH"
      - name: Application
        run: |
          mkdir build && cd build
          qmake ../p2pchat.pro
          make -j"$(nproc)"
      - name: Tests
        run: |
          mkdir build-tests && cd build-tests
          qmake ../tests/tests.pro
          make -j"$(nproc)"
          make check

  sanitizers:
    name: Linux, AddressSanitizer + UBSan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dépendances
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qtbase5-dev qtbase5-dev-tools qt5-qmake libssl-dev
          echo /usr/lib/qt5/bin >> "$GITHUB_PATH"
      - name: Tests sous sanitizers
        run: tests/run-sanitizers.sh "$PWD/build-asan"

  macos:
    name: macOS (Qt 5, clang)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Dépendances
        run: |
          brew install qt@5 openssl@3
          echo "$(brew --prefix qt@5)/bin" >> "$GITHUB_PATH"
      - name: Application
        run: |
          mkdir build && cd build
          qmake ../p2pchat.pro
          make -j"$(sysctl -n hw.ncpu)"
      - name: Tests
        run: |
          mkdir build-tests && cd build-tests
          qmake ../tests/tests.pro
          make -j"$(sysctl -n hw.ncpu)"
          make check

  windows:
    name: Windows (Qt 5, MSVC)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          arch: win64_msvc2019_64
          cache: true
      - name: OpenSSL (vcpkg)
        shell: pwsh
        run: |
          vcpkg install openssl:x64-windows
          $dir = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows"
          "OPENSSL_DIR=$dir" >> $env:GITHUB_ENV
          "$dir\bin" >> $env:GITHUB_PATH
      - name: Application
        shell: cmd
        run: |
          mkdir build && cd build
          qmake ..\p2pchat.pro
          nmake
      - name: Tests
        shell: cmd
        run: |
          mkdir build-tests && cd build-tests
          qmake ..\tests\tests.pro
          nmake
          nmake check
