<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b9cff"/>
      <stop offset="1" stop-color="#1a5fd6"/>
    </linearGradient>
    <linearGradient id="back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9ddff"/>
      <stop offset="1" stop-color="#a8c7fa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="18"/>
      <feOffset dy="14" result="blur"/>
      <feFlood flood-color="#0b2a66" flood-opacity="0.35"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Fond : carré arrondi (grille macOS : 824 px utiles, marge de 100 px) -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)" filter="url(#shadow)"/>

  <!-- Bulle arrière (reçue) -->
  <path d="M318 262 h300 a96 96 0 0 1 96 96 v120 a96 96 0 0 1 -96 96 h-170 l-96 70 v-70 h-34
           a96 96 0 0 1 -96 -96 v-120 a96 96 0 0 1 96 -96 z"
        fill="url(#back)"/>

  <!-- Bulle avant (envoyée) -->
  <g filter="url(#shadow)">
    <path d="M436 420 h282 a100 100 0 0 1 100 100 v128 a100 100 0 0 1 -100 100 h-12 v76 l-104 -76 h-166
             a100 100 0 0 1 -100 -100 v-128 a100 100 0 0 1 100 -100 z"
          fill="#ffffff"/>
  </g>

  <!-- Trois points -->
  <circle cx="487" cy="584" r="34" fill="#1a5fd6"/>
  <circle cx="577" cy="584" r="34" fill="#1a5fd6"/>
  <circle cx="667" cy="584" r="34" fill="#1a5fd6"/>
</svg>
